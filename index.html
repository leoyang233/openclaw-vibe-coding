<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>带着地图读三国</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 导航栏 -->
    <nav class="navbar">
      <div class="nav-brand">带着地图读三国</div>
      <div class="nav-links">
        <a href="#/" class="nav-link active" data-page="index">目录</a>
        <a href="#/map" class="nav-link" data-page="map">地图</a>
      </div>
    </nav>

    <!-- 首页 -->
    <div id="page-index" class="page active">
      <header class="header">
        <h1 class="header-title">带着地图读三国</h1>
        <p class="header-subtitle">一边读三国，一边看地图</p>
      </header>

      <div class="quick-actions">
        <div class="quick-btn" onclick="navigateTo('map')">
          <span class="icon">📍</span>
          <span>地图探索</span>
        </div>
        <div class="quick-btn" onclick="navigateTo('characters')">
          <span class="icon">👥</span>
          <span>人物志</span>
        </div>
        <div class="quick-btn" onclick="navigateTo('locations')">
          <span class="icon">🏛️</span>
          <span>地点录</span>
        </div>
      </div>

      <h2 class="section-title">章节目录</h2>
      <div id="chapter-list" class="chapter-list"></div>
    </div>

    <!-- 阅读页 -->
    <div id="page-read" class="page">
      <div class="chapter-header">
        <button class="back-btn" onclick="navigateTo('index')">← 返回</button>
        <h2 id="read-chapter-num" class="chapter-num"></h2>
        <h1 id="read-chapter-title" class="chapter-title"></h1>
      </div>

      <div id="read-location-bar" class="location-bar" onclick="showOnMap()">
        <span class="location-icon">📍</span>
        <span id="read-location-name" class="location-name"></span>
        <span id="read-location-desc" class="location-desc"></span>
        <span class="arrow">→</span>
      </div>

      <div id="read-map" class="map-preview">
        <div id="map-container-read" class="map-container"></div>
        <div class="map-overlay" onclick="toggleMap()">
          <span>点击展开地图</span>
        </div>
      </div>

      <div class="content-section">
        <h3 class="section-title">正 文</h3>
        <div id="read-content" class="content-text"></div>
      </div>

      <div class="characters-section">
        <h3 class="section-title">相关人物</h3>
        <div id="read-characters" class="characters-scroll"></div>
      </div>

      <div class="nav-bar">
        <button id="prev-btn" class="nav-btn" onclick="prevChapter()">← 上一回</button>
        <button id="next-btn" class="nav-btn" onclick="nextChapter()">下一回 →</button>
      </div>
    </div>

    <!-- 地图页 -->
    <div id="page-map" class="page">
      <div class="map-header">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="map-search" placeholder="搜索人物或地点" oninput="onMapSearch()">
        </div>
        <div class="filter-tabs">
          <span class="filter-tab active" data-filter="all" onclick="setMapFilter('all')">全部</span>
          <span class="filter-tab" data-filter="蜀" onclick="setMapFilter('蜀')">蜀</span>
          <span class="filter-tab" data-filter="魏" onclick="setMapFilter('魏')">魏</span>
          <span class="filter-tab" data-filter="吴" onclick="setMapFilter('吴')">吴</span>
        </div>
      </div>

      <div id="main-map" class="main-map"></div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot shu"></span>蜀</div>
        <div class="legend-item"><span class="legend-dot wei"></span>魏</div>
        <div class="legend-item"><span class="legend-dot wu"></span>吴</div>
        <div class="legend-item"><span class="legend-dot location"></span>地点</div>
      </div>

      <div id="bottom-sheet" class="bottom-sheet hidden">
        <div class="sheet-header">
          <h3 id="sheet-title" class="sheet-title"></h3>
          <span class="sheet-close" onclick="closeSheet()">✕</span>
        </div>
        <div class="sheet-content">
          <div id="sheet-info" class="sheet-info"></div>
          <div id="sheet-desc" class="sheet-desc"></div>
          <div class="sheet-actions">
            <button class="action-btn primary" onclick="viewDetail()">查看详情</button>
            <button class="action-btn secondary" onclick="goToChapter()">阅读章节</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 人物页 -->
    <div id="page-characters" class="page">
      <div class="page-header">
        <button class="back-btn" onclick="navigateTo('index')">← 返回</button>
        <h2>人物志</h2>
      </div>
      <div id="characters-list" class="characters-grid"></div>
    </div>

    <!-- 人物详情页 -->
    <div id="page-character-detail" class="page">
      <div class="character-header">
        <button class="back-btn" onclick="navigateTo('characters')">← 返回</button>
        <div id="char-avatar" class="char-avatar-large"></div>
        <div class="char-basic">
          <div class="char-name-row">
            <span id="char-name" class="char-name"></span>
            <span id="char-courtesy" class="char-courtesy"></span>
          </div>
          <span id="char-faction" class="faction-tag"></span>
          <div id="char-birthplace" class="char-birthplace">📍 <span></span></div>
        </div>
      </div>

      <div class="section">
        <h3 class="section-title">人物简介</h3>
        <div class="card">
          <p id="char-desc" class="card-text"></p>
        </div>
      </div>

      <div class="section">
        <h3 class="section-title">生平事迹</h3>
        <div class="card">
          <p id="char-story" class="card-text"></p>
        </div>
      </div>

      <div class="section">
        <h3 class="section-title">相关章节</h3>
        <div id="char-chapters" class="chapters-list"></div>
      </div>

      <div class="section">
        <h3 class="section-title">在地图上的位置</h3>
        <div id="char-map" class="mini-map"></div>
      </div>
    </div>

    <!-- 地点页 -->
    <div id="page-locations" class="page">
      <div class="page-header">
        <button class="back-btn" onclick="navigateTo('index')">← 返回</button>
        <h2>地点录</h2>
      </div>
      <div class="type-filter">
        <span class="filter-pill active" data-type="all" onclick="setLocationFilter('all')">全部</span>
        <span class="filter-pill" data-type="都城" onclick="setLocationFilter('都城')">都城</span>
        <span class="filter-pill" data-type="城池" onclick="setLocationFilter('城池')">城池</span>
        <span class="filter-pill" data-type="关隘" onclick="setLocationFilter('关隘')">关隘</span>
        <span class="filter-pill" data-type="战场" onclick="setLocationFilter('战场')">战场</span>
      </div>
      <div id="locations-list" class="locations-list"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
